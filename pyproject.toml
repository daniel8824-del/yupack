[project]
name = "yupack"
version = "0.2.7"
description = "yupack: 로컬 온톨로지 팩 MCP (생성·질의 완전 로컬, zip 하나로 완결)"
requires-python = ">=3.11"
dependencies = [
    # 상한 고정 필수: mcp 2.x는 mcp.server.fastmcp 경로를 없애 import가 죽는다.
    "mcp>=1.9.0,<2.0",
]

[project.optional-dependencies]
# 서버(Railway) 모드에서만 필요. 로컬 stdio 질의/생성은 표준 라이브러리만 쓴다.
server = ["uvicorn>=0.30", "starlette>=0.37"]
neo4j = ["neo4j>=5.20"]

[project.scripts]
yupack = "yupack_mcp.local:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["yupack_mcp"]
